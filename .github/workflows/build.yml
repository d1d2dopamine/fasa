name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Release, not debug. Same signing key, so it installs straight over the
      # previous build, but Compose and Kotlin are compiled with optimisations
      # on. Debug builds recompose far slower, which is what made switching
      # screens visibly stall.
      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: vespian-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
